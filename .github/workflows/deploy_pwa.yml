name: Can Lua Pro - Deploy iPhone/Android PWA
on:
  push:
    branches: [main]
    paths:
      - 'web_app/**'
      - '.github/workflows/deploy_pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: can-lua-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static files
        run: |
          test -s web_app/index.html
          test -s web_app/app.mjs
          test -s web_app/sw.js
          python3 -m json.tool web_app/manifest.webmanifest > /dev/null
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: web_app
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
