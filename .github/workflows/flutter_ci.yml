name: Build Android APK - Can Lua Pro
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build APK Android (tai xuong cai truc tiep)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org vn.canlua .
      - name: Verify no autogenerated MyApp test remains
        run: |
          if grep -q 'MyApp(' test/widget_test.dart; then
            echo 'Removing default Flutter scaffold widget_test.dart'
            rm test/widget_test.dart
          fi
      - name: Configure Android native permissions and name
        run: python3 scripts/configure_platforms.py
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Rename final APK and checksum
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/CAN_LUA_PRO_ANDROID.apk
          cd output && sha256sum CAN_LUA_PRO_ANDROID.apk > CAN_LUA_PRO_ANDROID.sha256.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CAN_LUA_PRO_ANDROID_APK
          path: |
            output/CAN_LUA_PRO_ANDROID.apk
            output/CAN_LUA_PRO_ANDROID.sha256.txt
          if-no-files-found: error
          retention-days: 30
