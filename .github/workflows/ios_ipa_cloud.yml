name: CAN LUA PRO V0.6.3 - IPA tren Mac Cloud

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Chon che do build tren may Mac cua GitHub'
        required: true
        default: unsigned_check
        type: choice
        options:
          - unsigned_check
          - signed_ipa
          - signed_ipa_testflight

permissions:
  contents: read

concurrency:
  group: can-lua-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-cloud:
    name: Build iOS (macOS 26)
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Kiem tra Xcode tren macOS
        run: |
          sw_vers
          xcodebuild -version
          xcrun --find codesign_allocate

      - name: Cai Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Chuan bi ung dung iOS
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -Eeuo pipefail
          flutter --version
          flutter create --platforms=ios --org vn.canlua --project-name lua_can_pro .
          flutter pub get
          python3 scripts/configure_ios_native.py
          if [ -f ios/Podfile ]; then
            (cd ios && pod install)
          fi

      - name: Phan tich va kiem thu
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Kiem tra build iOS (khong ky, khong tao IPA)
        if: ${{ inputs.build_mode == 'unsigned_check' }}
        run: |
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app
          echo 'BUILD IOS KHONG KY THANH CONG. DAY KHONG PHAI IPA CAI IPHONE.'

      - name: Kiem tra secrets ky iOS
        if: ${{ inputs.build_mode != 'unsigned_check' }}
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/ci_ios_validate_secrets.sh

      - name: Cai chung chi va provisioning profile (runner tam thoi)
        if: ${{ inputs.build_mode != 'unsigned_check' }}
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/ci_ios_signing.sh

      - name: Build IPA da ky cho App Store / TestFlight
        if: ${{ inputs.build_mode != 'unsigned_check' }}
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          flutter build ipa --release \
            --build-name=0.6.3 \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --export-options-plist="${RUNNER_TEMP}/canlua_ExportOptions.plist"
          bash scripts/ci_ios_verify_ipa.sh

      - name: Luu IPA vao GitHub Actions Artifacts
        if: ${{ inputs.build_mode != 'unsigned_check' }}
        uses: actions/upload-artifact@v4
        with:
          name: CAN_LUA_PRO_V0.6.3_IOS_SIGNED_IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Tai IPA len TestFlight (tuy chon)
        if: ${{ inputs.build_mode == 'signed_ipa_testflight' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ci_ios_upload_testflight.sh

      - name: Don khoa tam va provisioning profile
        if: ${{ always() && inputs.build_mode != 'unsigned_check' }}
        run: bash scripts/ci_ios_cleanup.sh
